          - heading "On-device" [level=3] [ref=f1e62]
          - paragraph [ref=f1e63]: The Whisper speech model runs on your own hardware. First use downloads it once (~40 MB); after that it works with no connection at all.
        - article [ref=f1e64]:
          - heading "Private by design" [level=3] [ref=f1e69]
          - paragraph [ref=f1e70]: Audio is processed locally and discarded when it's done. Nothing is uploaded, logged, or sent to a third party — there's no backend to send it to.
        - article [ref=f1e71]:
