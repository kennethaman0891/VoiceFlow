        - paragraph [ref=f4e54]: The same on-device engine powers the web demo and the desktop apps. No round-trip to the cloud — for speed, and for privacy.
      - generic [ref=f4e55]:
        - article [ref=f4e56]:
          - heading "On-device" [level=3] [ref=f4e62]
          - paragraph [ref=f4e63]: The Whisper speech model runs on your own hardware. First use downloads it once (~40 MB); after that it works with no connection at all.
        - article [ref=f4e64]:
          - heading "Private by design" [level=3] [ref=f4e69]
          - paragraph [ref=f4e70]: Audio is processed locally and discarded when it's done. Nothing is uploaded, logged, or sent to a third party — there's no backend to send it to.
        - article [ref=f4e71]:
          - heading "Fast & always ready" [level=3] [ref=f4e75]
          - paragraph [ref=f4e76]: No network hop means no waiting on a server. Dictate on a plane, in a cafe, or with the Wi-Fi switched off entirely.
