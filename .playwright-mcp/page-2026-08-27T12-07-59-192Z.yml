          - heading "On-device" [level=3] [ref=f2e62]
          - paragraph [ref=f2e63]: The Whisper speech model runs on your own hardware. First use downloads it once (~40 MB); after that it works with no connection at all.
        - article [ref=f2e64]:
          - heading "Private by design" [level=3] [ref=f2e69]
          - paragraph [ref=f2e70]: Audio is processed locally and discarded when it's done. Nothing is uploaded, logged, or sent to a third party — there's no backend to send it to.
        - article [ref=f2e71]:
