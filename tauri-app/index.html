<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0a0a0f" />
    <title>VoiceFlow — Local AI Dictation</title>
    <meta name="description" content="Push-to-talk speech-to-text that runs entirely on your computer. Offline Whisper + optional text cleanup." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles.css" />
    <!-- Security Headers (meta tag equivalents for static hosting) -->
    <meta http-equiv="X-Frame-Options" content="DENY" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="microphone=(), camera=(), geolocation=()" />
  
  <!-- Overlay window styles -->
  <style id="overlay-styles">
    /* These styles are applied when in overlay mode (#overlay) */
    body.overlay-mode,
    body:has(.voice-hud-root) {
      margin: 0 !important;
      padding: 0 !important;
      background: transparent !important;
      background-color: transparent !important;
      width: 100% !important;
      height: 100% !important;
      overflow: hidden !important;
    }
    #root {
      width: 100%;
      height: 100%;
    }
  </style>



</head>
  <body style="margin:0;background:#0a0a0f;color:#f5f5ff;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
