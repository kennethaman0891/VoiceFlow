[package]
name = "voiceflow-tauri"
version = "0.1.0"
description = "VoiceFlow — offline speech-to-text menu-bar app"
authors = ["Kenneth Aman"]
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.15"
whisper-rs = "0.4"
samplerate = "0.2"
anyhow = "1"

# WhisperFlow streaming engine
reqwest = { version = "0.12", features = ["json", "multipart"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
dotenv = "0.15"
