services:
  ollama:
    build:
      context: .
      dockerfile: docker/ollama/Dockerfile
      args:
        PULL_MODELS: phi-3.5-mini:q4_K_M
    image: voiceflow/ollama:latest
    container_name: voiceflow-ollama
    ports:
    - 11434:11434
    volumes:
    - voiceflow-ollama-data:/root/.ollama/models
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - curl
      - -f
      - http://localhost:11434/api/tags
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    - /run
    user: ollama
  whisper-api:
    build:
      context: .
      dockerfile: docker/whisper-api/Dockerfile
    image: voiceflow/whisper-api:latest
    container_name: voiceflow-whisper-api
    ports:
    - 8081:8080
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_CACHE: /app/models
    volumes:
    - voiceflow-whisper-cache:/app/models
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8080/health')
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - /tmp
    user: appuser
  dev:
    build:
      context: .
      dockerfile: docker/dev/Dockerfile
    image: voiceflow/dev:latest
    container_name: voiceflow-dev
    working_dir: /workspace/tauri-app
    volumes:
    - type: bind
      source: ./tauri-app
      target: /workspace/tauri-app
    - type: bind
      source: ./scripts
      target: /workspace/scripts
    - voiceflow-cargo-cache:/root/.cargo/registry
    - voiceflow-npm-cache:/workspace/tauri-app/node_modules
    - voiceflow-models:/workspace/tauri-app/src-tauri/models
    - voiceflow-dist:/workspace/tauri-app/dist
    environment:
    - GROQ_API_KEY=${GROQ_API_KEY:-}
    - OLLAMA_HOST=http://ollama:11434
    - WHISPER_API_URL=http://whisper-api:8080
    extra_hosts:
    - host.docker.internal:host-gateway
    stdin_open: true
    tty: true
    depends_on:
      ollama:
        condition: service_healthy
      whisper-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
    security_opt:
    - no-new-privileges:true
    read_only: false
    tmpfs:
    - /tmp
    - /workspace/tauri-app/target
    user: devuser
volumes:
  voiceflow-ollama-data:
    name: voiceflow-ollama-data
  voiceflow-whisper-cache:
    name: voiceflow-whisper-cache
  voiceflow-cargo-cache:
    name: voiceflow-cargo-cache
  voiceflow-npm-cache:
    name: voiceflow-npm-cache
  voiceflow-models:
    name: voiceflow-models
  voiceflow-dist:
    name: voiceflow-dist
